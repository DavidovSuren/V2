{{define "layout"}}<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Версия 2.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Тема до загрузки CSS, чтобы не мигало: cookie v2_theme = dark | light | auto
    // (auto — как в Telegram, вне Telegram — как в системе). По умолчанию тёмная.
    (function () {
      var m = document.cookie.match(/(?:^|; )v2_theme=(dark|light|auto)/);
      var pref = m ? m[1] : 'dark', theme = pref;
      if (pref === 'auto') {
        var tg = window.Telegram && window.Telegram.WebApp;
        theme = tg && tg.colorScheme ? tg.colorScheme
          : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-theme-pref', pref);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{template "icons"}}
{{template "content" .}}
<script src="/static/bootstrap.js" defer></script>
</body>
</html>
{{end}}
