{{define "content"}}
{{if .NeedBootstrap}}<div id="bootstrap-target"{{if .DevAuth}} data-dev-auth="1"{{end}}></div>{{end}}
<h1>Добро пожаловать в Version 2.0</h1>
<p class="subtitle">Персональная игра по превращению себя в лучшую версию за 365 дней. Твой путь начинается здесь.</p>

{{if .Error}}<div class="toast">{{.Error}}</div>{{end}}

<form method="POST" action="/onboarding" enctype="multipart/form-data">
  <div class="input-group">
    <label>Как тебя называть?</label>
    <input type="text" name="name" value="{{.Name}}" required>
  </div>

  <div class="input-group">
    <label>Возрастная группа</label>
    <div class="options">
      <label class="option"><input type="radio" name="ageGroup" value="17-20"{{if eq $.AgeGroup "17-20"}} checked{{end}} required> 17–20</label>
      <label class="option"><input type="radio" name="ageGroup" value="21-25"{{if eq $.AgeGroup "21-25"}} checked{{end}}> 21–25</label>
      <label class="option"><input type="radio" name="ageGroup" value="26-30"{{if eq $.AgeGroup "26-30"}} checked{{end}}> 26–30</label>
      <label class="option"><input type="radio" name="ageGroup" value="31-35"{{if eq $.AgeGroup "31-35"}} checked{{end}}> 31–35</label>
      <label class="option"><input type="radio" name="ageGroup" value="36-45"{{if eq $.AgeGroup "36-45"}} checked{{end}}> 36–45</label>
      <label class="option"><input type="radio" name="ageGroup" value="45+"{{if eq $.AgeGroup "45+"}} checked{{end}}> 45+</label>
    </div>
  </div>

  <div class="input-group">
    <label>Загрузи хотя бы одно фото (лицо, полный рост, обычная одежда)</label>
    <input type="file" name="photos" accept="image/*" multiple required>
  </div>

  <input type="hidden" name="refCode" value="{{.RefCode}}">

  <button class="btn btn-primary mt-16" type="submit">Продолжить</button>
</form>
{{end}}
