{{define "content"}}
<div id="bootstrap-target"></div>
<h1>Добро пожаловать в Version 2.0</h1>
<p class="subtitle">Персональная игра по превращению себя в лучшую версию за 365 дней. Твой путь начинается здесь.</p>

{{if .Error}}<div class="toast">{{.Error}}</div>{{end}}

<form method="POST" action="/onboarding" enctype="multipart/form-data">
  <div class="input-group">
    <label>Как тебя называть?</label>
    <input type="text" name="name" required>
  </div>

  <div class="input-group">
    <label>Возрастная группа</label>
    <div class="options">
      <label class="option"><input type="radio" name="ageGroup" value="17-20" required> 17–20</label>
      <label class="option"><input type="radio" name="ageGroup" value="21-25"> 21–25</label>
      <label class="option"><input type="radio" name="ageGroup" value="26-30"> 26–30</label>
      <label class="option"><input type="radio" name="ageGroup" value="31-35"> 31–35</label>
      <label class="option"><input type="radio" name="ageGroup" value="36-45"> 36–45</label>
      <label class="option"><input type="radio" name="ageGroup" value="45+"> 45+</label>
    </div>
  </div>

  <div class="input-group">
    <label>Загрузи хотя бы одно фото (лицо, полный рост, обычная одежда)</label>
    <input type="file" name="photos" accept="image/*" multiple required>
  </div>

  <input type="hidden" name="refCode" value="{{.RefCode}}">

  <button class="btn btn-primary mt-16" type="submit">Продолжить</button>
</form>
{{end}}
