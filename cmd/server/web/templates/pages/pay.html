{{define "content"}}
{{if .Unavailable}}
<h1>Оплата временно недоступна</h1>
<p class="subtitle">Мы уже знаем и чиним. Напиши в поддержку — поможем оформить подписку вручную.</p>
<a class="btn btn-secondary" href="/plans">К тарифам</a>
{{else}}
<h1>Оплата {{.TierName}}</h1>
<p class="subtitle">Сейчас откроется окно оплаты Telegram. Если не открылось — нажми кнопку.</p>
<div id="invoice" data-invoice-link="{{.Link}}"></div>
<button class="btn btn-primary" type="button" id="pay-button">Оплатить</button>
<a class="btn btn-text mt-8" href="/plans">Отмена</a>
<script src="/static/pay.js" defer></script>
{{end}}
{{end}}
